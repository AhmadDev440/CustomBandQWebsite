<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B&Q</title>
  <link rel="icon" type="image/png" href="B&Q_company_logo.svg.png">
  <link rel="stylesheet" type="text/css" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="script.js"></script>


</head>
<body>
  <div class="banner">
    <div class="banner-top">
        <a href="#">
            <img src="B&Q_company_logo.svg.png" class="logo">
        </a>
        <div class="upper-banner">
            <button class="menu-button bnq-club">B&Q Club</button>
            <button class="menu-button">Customer Support</button>
            <button class="menu-button">Sell on DIY.com</button>
            <button class="menu-button">Delivery/Collections</button>
            <button class="menu-button">Wish List</button>
            <button class="menu-button">Register</button>
            <button class="menu-button">Sign in</button>
        </div>
    </div>

    <div class="banner-content">
      <div class="search-wrapper">
          <div class="search-container">
              <input type="text" class="search-bar" placeholder="Search...">
              <button class="search-button">⌕</button>
          </div>
      </div>
      <div class="mid-banner">
          <button class="menu-button">Advice</button>
          <button class="menu-button">Services</button>
          <button class="menu-button">Stores</button>
          <button class="menu-button">Basket</button>
      </div>
    </div>
    <div class="slider-container">
      <span id="slider-label">B&Q</span>
      <div class="switch">
          <input type="checkbox" id="theme-slider">
          <span class="slider"></span>
      </div>
    </div>
  

  </div>


</body>
</html>
